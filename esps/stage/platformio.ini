[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@^3.6.0
    earlephilhower/ESP8266Audio@^1.9.7
    ESP32-audioI2S
    bblanchon/ArduinoJson@^6.21.3
build_flags =
    -DCORE_DEBUG_LEVEL=0
upload_protocol = espota
upload_port = stage-esp32.local
upload_flags =
    --auth=flamingods2024
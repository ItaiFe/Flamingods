[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DCONFIG_ETH_USE_SPI_ETHERNET=0
    -DCONFIG_ETH_USE_ESP32_EMAC=1
upload_speed = 460800

[env:esp32dev-ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DCONFIG_ETH_USE_SPI_ETHERNET=0
    -DCONFIG_ETH_USE_ESP32_EMAC=1
upload_protocol = espota
upload_port = 192.168.1.234
upload_flags = 
    --auth=test123
